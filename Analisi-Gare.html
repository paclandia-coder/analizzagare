    if(/^(riepilogo|summary|totali?|total)$/i.test(first)){total=parseT(r[idx.time])||total;continue}
    if(!/^\d+$/.test(first))continue;
    var time=parseT(r[idx.time]),dist=parseNum(r[idx.dist]);
    if(!time||!dist)continue;

    ['hr','hrMax','ascent','descent','power','wkg','powerMax','wkgMax','cadence','cadenceMax','gct','gctBal','stride','vo','vr','cal','temp'].forEach(function(k){if(idx[k]!=null){var v=parseNum(r[idx[k]]);if(v!=null)l[k]=v}});
    ['gap','bestPace'].forEach(function(k){if(idx[k]!=null){var v=parseT(r[idx[k]]);if(v!=null)l[k]=v}});

function parseTCX(text){

      var tm=tps[j].getElementsByTagNameNS('*','Time')[0];if(tm)tp.push(Date.parse(tm.textContent));
      var dd=tps[j].getElementsByTagNameNS('*','DistanceMeters')[0];if(a&&dd){gd.push(parseFloat(dd.textContent));ga.push(parseFloat(a.textContent))}
      if(a)alts.push(parseFloat(a.textContent));if(ww)w.push(parseFloat(ww.textContent));if(cc)cd.push(parseFloat(cc.textContent)*2)}

  if(id){var d=new Date(id.textContent);if(!isNaN(d))date=d.toISOString().slice(0,10)}

}
function buildElev(gd,ga){

function readFile(file){
  S.draftMsg='';S.draft=null;
  var ext=(file.name.split('.').pop()||'').toLowerCase();
  if(ext!=='csv'&&ext!=='tcx'){S.draftMsg='Formato non supportato: carica un file .csv o .tcx.';render();return}
  var fr=new FileReader();
  fr.onload=function(){
    try{

      var tot=sum(res.laps,function(l){return l.dist}),t=detectType(tot);

function smoothPts(pts){return pts.map(function(p,i){
  if(p.y==null)return p;var w=[pts[i-1],p,pts[i+1]].filter(function(q){return q&&q.y!=null});
  return {x:p.x,y:w.reduce(function(a,q){return a+q.y},0)/w.length}})}
function seriesFor(param,races,opt){
  var P=PARAMS[param];
  return races.map(function(r){
    if(P.elev){var e=elevOf(r,P.elev==='rel'),tx=e.pts.length?e.pts[e.pts.length-1].x:1;
      return {id:r.id,name:r.name,color:opt.color(r),pts:e.pts.map(function(p){return {x:opt.xMode==='pct'?p.x/tx*100:p.x,y:p.y}})}}
    var c=calc(r),tot=c[c.length-1].cumD,skip=P.raceOnly&&(r.kind||'gara')!=='gara';
    var pts=r.laps.map(function(l,i){var v=skip?null:P.get(l,c[i]);return {x:opt.xMode==='km'?c[i].cumD:opt.xMode==='pct'?c[i].cumD/tot*100:l.n,y:(v==null||!isFinite(v))?null:v}});
    if(opt.smooth&&!P.cum)pts=smoothPts(pts);
    return {id:r.id,name:r.name,color:opt.color(r),pts:pts}});
}

function render(){

  var m=$('#main');
  m.innerHTML=S.view==='gare'?viewGare():S.view==='scheda'?viewScheda():viewConfronto();

    var sel=S.selected.map(raceById).filter(Boolean);
    S.charts.forEach(function(ch,i){
      if(!$('#pl'+i))return;var P=PARAMS[ch.param];
      var xm=(P.elev&&S.xMode==='lap')?'km':S.xMode;
      var ser=seriesFor(ch.param,sel,{xMode:xm,smooth:S.smooth,color:function(r){return colorOf(r.id)}});
      $('#lg'+i).innerHTML=legendHTML(ser.filter(function(x){return x.pts.some(function(p){return p.y!=null})}));
      var dists={};sel.forEach(function(r){if((r.kind||'gara')==='gara')dists[r.distanceKm]=1});
      if(ch.param==='projV'||ch.param==='proj'){var nr=sel.filter(function(r){return (r.kind||'gara')!=='gara'}).length,msg=[];if(nr)msg.push('Allenamenti e sedute in pista non hanno un tempo atteso e non compaiono.');if(Object.keys(dists).length>1)msg.push('Le gare selezionate hanno distanze diverse: ogni tempo atteso si riferisce alla distanza di quella gara.');$('#nt'+i).textContent=msg.join(' ')}
      if(P.elev){var noE=sel.filter(function(r){return !(r.elev&&r.elev.length)}).map(function(r){return r.name});
        if(noE.length)$('#nt'+i).textContent=ch.param==='elev'?'Senza TCX la quota assoluta non è nota, quindi non compaiono: '+noE.join(', ')+'. Usa “dislivello dalla partenza” oppure completa queste attività con il TCX dalla scheda.':'Per '+noE.join(', ')+' il profilo è ricostruito dai dislivelli dei lap, quindi è approssimato.'}
      drawers.push(function(){drawChart($('#pl'+i),{series:ser,fmt:P.fmt,time:P.time,xMode:xm,area:!!P.elev&&ser.length===1,ref:refFor(ch.param),title:P.label})});
    });
  }
  if(S.view==='scheda'&&raceById(S.current)){
    var r=raceById(S.current),one=[r];
    function pair(params,names,id,fmt,time){
      var ser=params.map(function(p,k){return {id:p,name:names[k],color:'var(--s'+(k===0?1:2)+')',pts:seriesFor(p,one,{xMode:'lap',smooth:false,color:function(){return ''}})[0].pts}});
      $('#lg'+id).innerHTML=legendHTML(ser);
      drawers.push(function(){drawChart($('#pl'+id),{series:ser,fmt:fmt,time:time,xMode:'lap',title:names.join(', ')})})}
    pair(['pace','prog'],['Passo per lap','Passo medio progressivo'],0,fmtPace,true);
    if((r.kind||'gara')==='gara')pair(['projV','proj'],['Distanza normalizzata','Distanza GPS'],1,fmtTime,true);
    else pair(['hr'],['FC media'],1,d0,false);
    var evr=elevOf(r,false);if(!evr.exact)evr=elevOf(r,true);
    if(evr.pts.length){var es=[{id:'e',name:'Quota',color:'var(--s1)',pts:evr.pts}];drawers.push(function(){drawChart($('#pl2'),{series:es,fmt:d0,time:false,xMode:'km',area:true,title:'Profilo altimetrico'})})}
    else{$('#pl2').innerHTML='<div class="empty">Nessun dato di altitudine. Completa l\'attività con il file TCX.</div>'}
    drawers.push(function(){var d=S.dual||{a:'elev',b:'pace'},A=dualSeries(r,d.a,'var(--s1)'),B=dualSeries(r,d.b,'var(--s2)');
      var nt=[];if(PARAMS[d.a].elev==='abs'&&!(r.elev&&r.elev.length))nt.push('quota ricostruita dai dislivelli per lap (serve il TCX per quella precisa)');
      if(!PARAMS[d.a].elev||!PARAMS[d.b].elev)nt.push('i parametri per lap sono collegati con una linea tra i punti di fine lap');
      $('#nt3').textContent=nt.join(' · ');drawDual($('#pl3'),A,B)})
  }
  requestAnimationFrame(function(){drawers.forEach(function(f){f()})});
}

function mergeFile(file){
  var ext=(file.name.split('.').pop()||'').toLowerCase(),r=raceById(S.current);
  if(!r||(ext!=='csv'&&ext!=='tcx')){toast('Carica un file .csv o .tcx.');return}
  var fr=new FileReader();
  fr.onload=function(){
    try{
      var res=ext==='csv'?parseCSV(String(fr.result)):parseTCX(String(fr.result)),msg=[];
      var t0=sum(r.laps,function(l){return l.time}),t1=sum(res.laps,function(l){return l.time});
      if(Math.abs(t1-t0)/t0>0.05)throw new Error('Il file non sembra della stessa attività: la durata è diversa.');
      r.files=filesOf(r);r.files[ext]=true;
      if(res.elev){r.elev=res.elev;r.elevStep=res.elevStep||0.1;msg.push('profilo altimetrico aggiunto')}
      if(res.laps.length===r.laps.length&&t1-t0>2){
        if(ext==='tcx'){res.laps.forEach(function(l,i){r.laps[i].time=l.time})}else{r.laps[r.laps.length-1].time+=t1-t0}
        delete r.timeFix;msg.push('tempo corretto da '+fmtTime(t0)+' a '+fmtTime(t1))}
      if(res.laps.length===r.laps.length){var n=0;res.laps.forEach(function(l,i){Object.keys(l).forEach(function(k){if(k!=='n'&&k!=='time'&&k!=='dist'&&r.laps[i][k]==null){r.laps[i][k]=l[k];n++}})});if(n)msg.push('dati per lap completati')}
      else msg.push('lap non abbinati perché il numero è diverso');
      if(!msg.length)msg.push('niente di nuovo da aggiungere');
      save();render();toast(msg.join(', '))
    }catch(e){toast(e.message||'File non leggibile')}
  };
  fr.readAsText(file)
}
function keepScroll(){var w=$('.tblwrap.tall'),y=w?w.scrollTop:0,x=w?w.scrollLeft:0;save();render();var n=$('.tblwrap.tall');if(n){n.scrollTop=y;n.scrollLeft=x}}

function stampName(ts){var d=ts?new Date(ts):new Date();return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'-'+pad(d.getHours())+pad(d.getMinutes())}
function dlBlob(name,text,type){var b=new Blob([text],{type:type}),u=URL.createObjectURL(b),l=document.createElement('a');l.href=u;l.download=name;document.body.appendChild(l);l.click();l.remove();setTimeout(function(){URL.revokeObjectURL(u)},3000)}
function buildPage(){
  var el=document.documentElement.cloneNode(true),x;
  x=el.querySelector('#main');if(x)x.innerHTML='';
  x=el.querySelector('#overlay');if(x)x.innerHTML='';
  x=el.querySelector('#toast');if(x){x.textContent='';x.setAttribute('hidden','')}
  x=el.querySelector('#embed');x.textContent=JSON.stringify(snapshot()).replace(/</g,'\\u003c');
  return '<!doctype html>\n'+el.outerHTML}
function idb(mode,fn){return new Promise(function(res,rej){try{var q=indexedDB.open('analisi-gare-fs',1);q.onupgradeneeded=function(){q.result.createObjectStore('h')};q.onerror=function(){rej(q.error)};q.onsuccess=function(){try{var tx=q.result.transaction('h',mode),st=tx.objectStore('h'),rq=fn(st)}catch(e){rej(e);return}tx.oncomplete=function(){res(rq&&rq.result)};tx.onerror=function(){rej(tx.error)}}}catch(e){rej(e)}})}
async function getDir(){
  var h=null;try{h=await idb('readonly',function(st){return st.get('dir')})}catch(e){}
  if(h){try{var o={mode:'readwrite'};if(await h.queryPermission(o)==='granted'||await h.requestPermission(o)==='granted')return h}catch(e){}}
  var d=await window.showDirectoryPicker({id:'analisi-gare',mode:'readwrite',startIn:h||'documents'});
  try{await idb('readwrite',function(st){return st.put(d,'dir')})}catch(e){}
  return d}
async function writeTo(dir,name,text){var f=await dir.getFileHandle(name,{create:true}),w=await f.createWritable();await w.write(text);await w.close()}
async function savePage(){
  var html=buildPage(),emb=readEmbed(),prev=JSON.stringify(emb||snapshot()),direct=false,bk='analisi-gare-backup-'+stampName(emb&&emb.rev)+'.json';
  if(window.showDirectoryPicker){
    try{var dir=await getDir();await writeTo(dir,bk,prev);await writeTo(dir,'Analisi-Gare.html',html);direct=true;
      $('#embed').textContent=JSON.stringify(snapshot()).replace(/</g,'\\u003c');
      toast('Salvati nella cartella “'+dir.name+'”: Analisi-Gare.html e '+bk);return}
    catch(e){if(e&&e.name==='AbortError')return}}
  if(window.showSaveFilePicker){
    try{var fh=await window.showSaveFilePicker({id:'analisi-gare',suggestedName:'Analisi-Gare.html',types:[{description:'Pagina HTML',accept:{'text/html':['.html']}}]});
      var w=await fh.createWritable();await w.write(html);await w.close();direct=true}
    catch(e){if(e&&e.name==='AbortError')return}}
  if(!direct)dlBlob('Analisi-Gare.html',html,'text/html');
  setTimeout(function(){dlBlob(bk,prev,'application/json')},600);
  $('#embed').textContent=JSON.stringify(snapshot()).replace(/</g,'\\u003c');
  toast(direct?'Pagina salvata. Backup della versione precedente in download.':'Pagina e backup scaricati: sostituisci il vecchio file in Dropbox.')}

function doRestore(txt,mode){

  if(a==='filter'){S.filter=t.dataset.f;if(S.filter!=='all')S.kindFilter='gara';selectOnly(visible().map(function(r){return r.id}));save();render()}
  else if(a==='selAll'){var add=visible().map(function(r){return r.id}).filter(function(id){return S.selected.indexOf(id)<0}),room=8-S.selected.length;S.selected=S.selected.concat(add.slice(0,Math.max(0,room)));if(add.length>room)toast('Raggiunto il massimo di 8 attività');save();render()}

  else if(a==='rmchart'){S.charts.splice(+t.dataset.ci,1);save();render()}
  else if(a==='open'){S.current=id;go('scheda')}
  else if(a==='del'){
    if(t.dataset.arm){S.races=S.races.filter(function(r){return r.id!==id});S.selected=S.selected.filter(function(x){return x!==id});if(S.current===id)S.current=S.races.length?sortedRaces()[0].id:null;save();render();toast('Attività eliminata')}
    else{t.dataset.arm='1';t.textContent='Conferma';t.classList.add('danger');setTimeout(function(){if(t.isConnected){delete t.dataset.arm;t.textContent='Elimina';t.classList.remove('danger')}},3500)}}
  else if(a==='dkind'){S.draft.kind=t.dataset.k;render()}
  else if(a==='kfilter'){S.kindFilter=t.dataset.f;if(S.kindFilter!=='all'&&S.kindFilter!=='gara')S.filter='all';selectOnly(visible().map(function(r){return r.id}));save();render()}
  else if(a==='exclAnom'){var rx=raceById(S.current),ax=anomalies(rx.laps);rx.laps.forEach(function(l,i){if(ax[i])l.excl=true});keepScroll()}
  else if(a==='exclNone'){raceById(S.current).laps.forEach(function(l){delete l.excl});keepScroll()}
  else if(a==='lockToggle'){S.unlocked=S.unlocked===S.current?null:S.current;render()}
  else if(a==='lfchip'){var k=t.dataset.t;if(LF.types[k])delete LF.types[k];else LF.types[k]=1;render()}
  else if(a==='cfreset'){CF={km1:'',km2:'',d1:'',d2:'',q:''};S.filter='all';S.kindFilter='all';selectOnly(visible().map(function(r){return r.id}));save();render()}
  else if(a==='lfreset'){LF={types:{},km1:'',km2:'',d1:'',d2:'',q:''};render()}
  else if(a==='lfcompare'){var L=lfList().slice(0,8);if(!L.length){toast('Nessuna attività da confrontare.');return}selectOnly(L.map(function(r){return r.id}));save();go('confronto')}
  else if(a==='cancelDraft'){S.draft=null;S.draftMsg='';render()}
  else if(a==='saveDraft'){
    var d=S.draft;if(!d)return;
    d.name=$('#dName').value.trim();d.date=$('#dDate').value;d.location=$('#dLoc').value.trim();
    if(!d.name){S.draftMsg='Inserisci un nome.';render();$('#dName').focus();return}
    var km,tp=d.type;if(d.kind==='gara'){km=d.type==='altro'?parseFloat($('#dKm').value):TYPES[d.type].km}else{km=sum(d.laps,function(l){return l.dist});tp='altro'}
    if(!(km>0)){S.draftMsg='Inserisci la distanza ufficiale in km.';render();return}
    var r={id:uid(),name:d.name,date:d.date,location:d.location,kind:d.kind,type:tp,distanceKm:km,timeFix:d.fix>1.5?{s:Math.round(d.fix),lap:d.laps.length}:undefined,elev:d.elev||undefined,elevStep:d.elev?0.1:undefined,source:d.source,files:{csv:d.source==='csv',tcx:d.source==='tcx'},laps:d.laps,added:Date.now()};
    S.races.push(r);if(S.selected.length<8)S.selected.push(r.id);S.current=r.id;S.draft=null;S.draftMsg='';save();go('scheda');toast('Attività salvata')}
  else if(a==='closeData'){$('#overlay').innerHTML=''}
  else if(a==='dl'){dlBlob('analisi-gare-dati-'+stampName()+'.json',$('#dJson').value,'application/json');toast('Se il download non parte, usa “Copia il testo”.')}
  else if(a==='copyJson'){
    var ta=$('#dJson');
    (navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(ta.value):Promise.reject()).then(function(){toast('Testo copiato')},function(){ta.focus();ta.select();toast('Seleziona e copia il testo (Ctrl/Cmd+C)')})}
  else if(a==='restore'){var tx=$('#impTxt').value.trim();if(tx)doRestore(tx,'add');else toast('Incolla il testo oppure scegli un file.')}
  else if(a==='restoreAll'){var tx2=$('#impTxt').value.trim();if(!tx2){toast('Incolla il testo oppure scegli un file.');return}
    if(t.dataset.arm){doRestore(tx2,'all')}else{t.dataset.arm='1';t.textContent='Conferma: sostituisci tutto';t.classList.add('danger');setTimeout(function(){if(t.isConnected){delete t.dataset.arm;t.textContent='Sostituisci tutte le gare con il backup';t.classList.remove('danger')}},4000)}}
  else if(a==='savePage'){savePage()}
  else if(a==='restoreDisp'){var dv=null;try{dv=localStorage.getItem(KEY+'-displaced')}catch(e){}if(dv)doRestore(dv,'add')}
});
document.addEventListener('change',function(e){
  var t=e.target,a=t.dataset&&t.dataset.act;
  var cm={cfKm1:'km1',cfKm2:'km2',cfD1:'d1',cfD2:'d2',cfQ:'q'};
  if(cm[t.id]){CF[cm[t.id]]=t.value;setTimeout(function(){var ae=document.activeElement,id=ae&&ae.id&&/^cf/.test(ae.id)?ae.id:null;selectOnly(visible().map(function(r){return r.id}));save();render();if(id){var el=document.getElementById(id);if(el)try{el.focus()}catch(e){}}},0);return}
  if(t.id==='file'&&t.files[0])readFile(t.files[0]);
  else if(t.id==='mergeFile'&&t.files[0])mergeFile(t.files[0]);
  else if(t.id==='impFile'&&t.files[0]){var fr=new FileReader();fr.onload=function(){$('#impTxt').value=String(fr.result);toast('File letto: scegli se aggiungere le gare mancanti o sostituire tutto.')};fr.readAsText(t.files[0])}
  else if(a==='pick'){var id=t.dataset.id,i=S.selected.indexOf(id);if(t.checked&&i<0)S.selected.push(id);else if(!t.checked&&i>-1)S.selected.splice(i,1);save();render()}
  else if(a==='dual'){S.dual=S.dual||{a:'elev',b:'pace'};S.dual[t.dataset.w]=t.value;render()}
  else if(a==='param'){S.charts[+t.dataset.ci].param=t.value;save();render()}
  else if(a==='excl'){var rr=raceById(S.current),ll=rr.laps[+t.dataset.i];if(t.checked)ll.excl=true;else delete ll.excl;keepScroll()}
  else if(t.id==='optSmooth'){S.smooth=t.checked;save();render()}
  else if(t.id==='tgt'){S.target=t.value.trim();save();render()}
  else if(t.id==='tgtType'){S.targetType=t.value;save();render()}
  else if(t.id==='dType'){S.draft.type=t.value;$('#dKmWrap').hidden=t.value!=='altro'}
  else if(t.id==='pickRace'){S.current=t.value;render()}
  else if(S.view==='scheda'&&/^e(Name|Date|Loc|Type|Km|Kind)$/.test(t.id)){
    var r=raceById(S.current);if(!r)return;
    if(t.id==='eName'&&t.value.trim())r.name=t.value.trim();
    if(t.id==='eKind'){r.kind=t.value;var tt=sum(r.laps,function(l){return l.dist});if(t.value==='gara'){r.type=detectType(tt);r.distanceKm=r.type==='altro'?Math.round(tt*10)/10:TYPES[r.type].km}else{r.type='altro';r.distanceKm=tt}}
    if(t.id==='eDate')r.date=t.value;if(t.id==='eLoc')r.location=t.value.trim();
    if(t.id==='eType'){r.type=t.value;if(t.value!=='altro')r.distanceKm=TYPES[t.value].km;else r.distanceKm=Math.round(sum(r.laps,function(l){return l.dist})*10)/10}
    if(t.id==='eKm'&&parseFloat(t.value)>0)r.distanceKm=parseFloat(t.value);
    save();render()}
});
document.addEventListener('dragover',function(e){var d=e.target.closest&&e.target.closest('#drop');if(d){e.preventDefault();d.classList.add('over')}});
document.addEventListener('dragleave',function(e){var d=e.target.closest&&e.target.closest('#drop');if(d)d.classList.remove('over')});

})();
