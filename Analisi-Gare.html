function mergeInto(r,res,ext){
  var msg=[];
  var t0=sum(r.laps,function(l){return l.time}),t1=sum(res.laps,function(l){return l.time});
  if(Math.abs(t1-t0)/t0>0.05)throw new Error('Il file non sembra della stessa attività: la durata è diversa.');
  r.files=filesOf(r);r.files[ext]=true;
  if(res.elev){r.elev=res.elev;r.elevStep=res.elevStep||0.1;msg.push('profilo altimetrico aggiunto')}
  if(res.laps.length===r.laps.length&&t1-t0>2){
    if(ext==='tcx'){res.laps.forEach(function(l,i){r.laps[i].time=l.time})}else{r.laps[r.laps.length-1].time+=t1-t0}
    delete r.timeFix;msg.push('tempo corretto da '+fmtTime(t0)+' a '+fmtTime(t1))}
  if(ext==='tcx'&&res.date&&!r.date){r.date=res.date;msg.push('data letta dal TCX: '+fmtDate(res.date))}
  if(res.geo&&!r.geo){r.geo=res.geo;if(!r.location){var nl=nearLoc(res.geo,r);if(nl){r.location=nl;msg.push('località proposta: '+nl)}}}
  if(res.prof&&(r.kind==='pista'||r.kind==='test')&&!r.prof){r.prof=res.prof;msg.push('profilo della seduta aggiunto')}
  if(ext==='csv'&&res.laps.length===r.laps.length){res.laps.forEach(function(l,i){if(l.ph)r.laps[i].ph=l.ph});
    if((r.kind==='pista'||r.kind==='test')&&res.laps.every(function(l,i){return Math.abs(l.time-r.laps[i].time)<3})){res.laps.forEach(function(l,i){r.laps[i].time=l.time});msg.push('tempi dei lap precisi dal CSV')}}
  if(res.laps.length===r.laps.length){var n=0;res.laps.forEach(function(l,i){Object.keys(l).forEach(function(k){if(k!=='n'&&k!=='time'&&k!=='dist'&&r.laps[i][k]==null){r.laps[i][k]=l[k];n++}})});if(n)msg.push('dati per lap completati')}
  else msg.push('lap non abbinati perché il numero è diverso');
  if(!msg.length)msg.push('niente di nuovo da aggiungere');
  return msg}
function mergeFile(file){
  var ext=(file.name.split('.').pop()||'').toLowerCase(),r=raceById(S.current);
  if(!r||(ext!=='csv'&&ext!=='tcx')){toast('Carica un file .csv o .tcx.');return}
  var fr=new FileReader();
  fr.onload=function(){
    try{
      var res=ext==='csv'?parseCSV(String(fr.result)):parseTCX(String(fr.result));
      var msg=mergeInto(r,res,ext);
      save();render();toast(msg.join(', '))
    }catch(e){toast(e.message||'File non leggibile')}
  };
  fr.readAsText(file)
}

function stampName(ts){var d=ts?new Date(ts):new Date();return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'-'+pad(d.getHours())+pad(d.getMinutes())}
function dlBlob(name,text,type){var b=new Blob([text],{type:type}),u=URL.createObjectURL(b),l=document.createElement('a');l.href=u;l.download=name;document.body.appendChild(l);l.click();l.remove();setTimeout(function(){URL.revokeObjectURL(u)},3000)}
function buildPage(){
  var el=document.documentElement.cloneNode(true),x;
  x=el.querySelector('#main');if(x)x.innerHTML='';

  x=el.querySelector('#toast');if(x){x.textContent='';x.setAttribute('hidden','')}

function idb(mode,fn){return new Promise(function(res,rej){try{var q=indexedDB.open('analisi-gare-fs',1);q.onupgradeneeded=function(){q.result.createObjectStore('h')};q.onerror=function(){rej(q.error)};q.onsuccess=function(){try{var tx=q.result.transaction('h',mode),st=tx.objectStore('h'),rq=fn(st)}catch(e){rej(e);return}tx.oncomplete=function(){res(rq&&rq.result)};tx.onerror=function(){rej(tx.error)}}}catch(e){rej(e)}})}
function tmo(p,ms){return new Promise(function(res,rej){var t=setTimeout(function(){rej(new Error('timeout'))},ms);p.then(function(v){clearTimeout(t);res(v)},function(e){clearTimeout(t);rej(e)})})}
async function getDir(){
  var h=null;try{h=await tmo(idb('readonly',function(st){return st.get('dir')}),800)}catch(e){}
  if(h){try{var o={mode:'readwrite'};if(await tmo(h.queryPermission(o),800)==='granted'||await tmo(h.requestPermission(o),1500)==='granted')return h}catch(e){}}
  var d=await window.showDirectoryPicker({id:'analisi-gare',mode:'readwrite',startIn:h||'documents'});
  try{await tmo(idb('readwrite',function(st){return st.put(d,'dir')}),1500)}catch(e){}
  return d}
async function writeTo(dir,name,text){var f=await tmo(dir.getFileHandle(name,{create:true}),8000),w=await tmo(f.createWritable(),8000);await tmo(w.write(text),20000);await tmo(w.close(),20000)}

  if(!onlyDownload&&window.showSaveFilePicker){

  if(!direct)dlBlob('Analisi-Gare.html',html,'text/html');

function doRestore(txt,mode){
  try{
    var d=JSON.parse(txt);if(!d||!Array.isArray(d.races))throw 0;
    var ok=d.races.filter(function(r){return r&&r.laps&&r.laps.length&&r.id});
    if(mode==='all'){S.races=ok;S.selected=(d.selected||ok.map(function(r){return r.id})).filter(function(id){return ok.some(function(r){return r.id===id})}).slice(0,8);S.current=ok.length?sortedRaces()[0].id:null;save();$('#overlay').innerHTML='';render();toast('Ripristinate '+ok.length+' attività dal backup');return}
    var n=0;ok.forEach(function(r){if(!raceById(r.id)){S.races.push(r);n++}});
    save();$('#overlay').innerHTML='';render();toast(n+(n===1?' gara aggiunta':' gare aggiunte'));
  }catch(e){toast('File non valido: servono i dati esportati da questa pagina.')}
}

document.addEventListener('change',function(e){
